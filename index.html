<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioZZA - Live Stream</title>
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0f0f0f; --card-bg: #1a1a1a; --accent: #e02020; --text-main: #ffffff; --text-dim: #b3b3b3; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text-main); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .app-container { width: 100%; max-width: 380px; height: 85vh; background: var(--bg-color); border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 1px solid #222; position: relative; }
        header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: 32px; object-fit: cover; border-radius: 8px; border: 1px solid #333; }
        .player-display { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 30px; text-align: center; }
        .art-wrapper { position: relative; width: 220px; height: 220px; }
        .art-work { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; transition: all 0.5s; box-shadow: 0 20px 40px rgba(0,0,0,0.6); background: #222; }
        .art-work.playing { transform: scale(1.05); box-shadow: 0 0 30px var(--accent); }
        .info-stack { margin-top: 25px; width: 100%; }
        .info-stack h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
        .info-stack p { color: var(--text-dim); font-size: 0.85rem; }
        .live-indicator { font-size: 0.65rem; color: #fff; background: var(--accent); padding: 4px 12px; border-radius: 4px; margin-top: 10px; display: inline-flex; align-items: center; gap: 5px; font-weight: bold; text-transform: uppercase; }
        .scrubber { width: 100%; padding: 20px 35px; }
        .progress-bar { height: 5px; background: #333; border-radius: 10px; position: relative; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; border-radius: 10px; transition: width 0.3s linear; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 0.7rem; margin-top: 8px; color: var(--text-dim); }
        .main-controls { display: flex; justify-content: center; align-items: center; padding: 0 20px 30px; }
        .btn-play { width: 70px; height: 70px; background: var(--text-main); color: #000; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; cursor: pointer; }
        .playlist-drawer { background: var(--card-bg); border-top: 1px solid #2a2a2a; padding: 15px; max-height: 250px; overflow-y: auto; }
        .list-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; margin-bottom: 6px; opacity: 0.6; }
        .list-item.active { background: rgba(224, 32, 32, 0.15); opacity: 1; border: 1px solid rgba(224, 32, 32, 0.3); }
        .list-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
        #auth-overlay { position: absolute; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .start-btn { background: var(--accent); color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .persian { direction: rtl; font-family: 'Tahoma', sans-serif; }
        footer { margin-top: 20px; font-size: 0.7rem; color: #333; }
        footer a { color: inherit; text-decoration: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Overlay for Autoplay -->
        <div id="auth-overlay">
            <h2 style="margin-bottom: 20px;">RadioZZA</h2>
            <button class="start-btn" id="startBtn">Listen Live</button>
            <p id="loadingMsg" style="margin-top:15px; font-size: 0.75rem; color: var(--text-dim)">Connecting...</p>
        </div>

        <header>
            <div class="logo-container">
                <img src="https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg" class="brand-logo">
                <div>
                    <span style="font-size: 0.7rem; font-weight: bold;">RADIOZZA</span>
                    <div style="font-size: 0.6rem; color: #4ade80;"><span id="listenerCount">0</span> Listeners</div>
                </div>
            </div>
        </header>

        <div class="player-display">
            <div class="art-wrapper">
                <img src="" class="art-work" id="mainArt">
            </div>
            <div class="info-stack">
                <h1 id="mainTitle" class="persian">Loading...</h1>
                <p id="mainArtist" class="persian">Please wait</p>
                <div class="live-indicator"><i class="fas fa-broadcast-tower"></i> Live</div>
            </div>
        </div>

        <div class="scrubber">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="time-stamps"><span id="currTime">0:00</span><span id="durTime">0:00</span></div>
        </div>

        <div class="main-controls">
            <div class="btn-play" id="playBtn"><i class="fas fa-play" id="playIcon"></i></div>
        </div>

        <div class="playlist-drawer" id="playlistItems"></div>
    </div>

    <footer><a href="playlist.html">CMS Access</a></footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_jObj_5sPLaPS55oUcoYQCYRso18cJqo",
            authDomain: "radio-zza.firebaseapp.com",
            projectId: "radio-zza",
            storageBucket: "radio-zza.firebasestorage.app",
            messagingSenderId: "690383318671",
            appId: "1:690383318671:web:67190ec3907a9eaa914afa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'radiozza-live-v2';
        const audio = new Audio();
        audio.crossOrigin = "anonymous";

        let trackList = [];
        let globalStartTime = 0;
        let isPlaying = false;

        // Elements
        const els = {
            art: document.getElementById('mainArt'),
            title: document.getElementById('mainTitle'),
            artist: document.getElementById('mainArtist'),
            playIcon: document.getElementById('playIcon'),
            fill: document.getElementById('progressFill'),
            list: document.getElementById('playlistItems'),
            overlay: document.getElementById('auth-overlay'),
            listeners: document.getElementById('listenerCount'),
            playBtn: document.getElementById('playBtn'),
            startBtn: document.getElementById('startBtn')
        };

        // Initialize
        signInAnonymously(auth).then(user => {
            document.getElementById('loadingMsg').innerText = "Ready to Play";
            syncStream();
            trackPresence(user.user.uid);
        });

        // Start Radio (Fixes Autoplay)
        els.startBtn.onclick = () => {
            els.overlay.style.display = 'none';
            togglePlay();
        };

        function syncStream() {
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'stream_state', 'current'), (snap) => {
                if (snap.exists()) globalStartTime = snap.data().startTime;
                calculateLivePosition();
            });

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'playlist'), (snap) => {
                trackList = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.createdAt - b.createdAt);
                renderPlaylist();
                calculateLivePosition();
            });
        }

        async function calculateLivePosition() {
            if (trackList.length === 0 || !globalStartTime) return;
            const totalDuration = trackList.reduce((acc, t) => acc + (parseFloat(t.duration) || 0), 0);
            const currentCyclePos = ((Date.now() - globalStartTime) / 1000) % totalDuration;
            
            let cumulative = 0;
            let currentTrack = trackList[0];
            let seekTo = 0;

            for (let t of trackList) {
                const dur = parseFloat(t.duration) || 0;
                if (currentCyclePos < (cumulative + dur)) {
                    currentTrack = t;
                    seekTo = currentCyclePos - cumulative;
                    break;
                }
                cumulative += dur;
            }

            if (audio.src !== currentTrack.url) {
                audio.src = currentTrack.url;
                audio.load();
                audio.currentTime = seekTo;
                updateUI(currentTrack);
                if (isPlaying) tryPlay();
            } else if (Math.abs(audio.currentTime - seekTo) > 3) {
                audio.currentTime = seekTo; // Drift correction
            }
        }

        async function tryPlay() {
            try {
                await audio.play();
                isPlaying = true;
                els.playIcon.className = "fas fa-pause";
                els.art.classList.add('playing');
            } catch (err) {
                isPlaying = false;
                els.playIcon.className = "fas fa-play";
            }
        }

        async function togglePlay() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                els.playIcon.className = "fas fa-play";
                els.art.classList.remove('playing');
            } else {
                await calculateLivePosition(); 
                tryPlay();
            }
        }
        els.playBtn.onclick = togglePlay;

        function updateUI(track) {
            els.title.innerText = track.title;
            els.artist.innerText = track.artist;
            els.art.src = track.art;
            document.getElementById('durTime').innerText = format(track.duration);
            renderPlaylist();
        }

        function renderPlaylist() {
            els.list.innerHTML = trackList.map(t => `
                <div class="list-item ${audio.src === t.url ? 'active' : ''}">
                    <img src="${t.art}">
                    <div style="flex:1">
                        <div class="persian" style="font-size:0.8rem">${t.title}</div>
                        <div style="font-size:0.7rem; color:var(--text-dim)">${t.artist}</div>
                    </div>
                </div>
            `).join('');
        }

        function trackPresence(uid) {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'presence', uid);
            const up = () => setDoc(ref, { last: Date.now() });
            up(); setInterval(up, 30000);
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'presence'), (s) => {
                const active = s.docs.filter(d => (Date.now() - d.data().last) < 60000).length;
                els.listeners.innerText = active || 1;
            });
        }

        audio.ontimeupdate = () => {
            if (audio.duration) els.fill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
            document.getElementById('currTime').innerText = format(audio.currentTime);
        };
        audio.onended = () => calculateLivePosition();
        
        // Auto-sync check every 10 seconds
        setInterval(() => { if(isPlaying) calculateLivePosition(); }, 10000);

        function format(s) {
            if (isNaN(s)) return "0:00";
            const m = Math.floor(s/60), sec = Math.floor(s%60);
            return `${m}:${sec.toString().padStart(2,'0')}`;
        }
    </script>
</body>
</html>
