<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioZZA</title>
    <link id="favicon" rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #e02020;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --glass: rgba(255, 255, 255, 0.05);
            --admin-gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 380px;
            height: 90vh;
            background: var(--bg-color);
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid #222;
            position: relative;
        }

        header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: 32px; object-fit: cover; border-radius: 8px; border: 1px solid #333; }

        .player-display { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 30px; }
        .art-wrapper { position: relative; width: 240px; height: 240px; }
        .art-work { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; transition: all 0.5s; box-shadow: 0 20px 40px rgba(0,0,0,0.6); background: #222; }
        .art-work.playing { transform: scale(1.05); box-shadow: 0 0 30px var(--accent); }

        .info-stack { text-align: center; margin-top: 25px; width: 100%; }
        .info-stack h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
        .info-stack p { color: var(--text-dim); font-size: 0.85rem; }

        .scrubber { width: 100%; padding: 20px 35px; }
        .progress-bar { height: 5px; background: #333; border-radius: 10px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; border-radius: 10px; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 0.7rem; margin-top: 8px; color: var(--text-dim); }

        .main-controls { display: flex; justify-content: space-evenly; align-items: center; padding: 0 20px 25px; }
        .btn-play { width: 65px; height: 65px; background: var(--text-main); color: #000; border-radius: 50%; display: grid; place-items: center; font-size: 1.4rem; cursor: pointer; }
        .secondary-btn { color: var(--text-dim); font-size: 1.2rem; cursor: pointer; background: none; border: none; }

        .admin-active .secondary-btn.admin-toggle { color: var(--admin-gold); }

        .playlist-drawer { background: var(--card-bg); border-top: 1px solid #2a2a2a; padding: 15px; max-height: 250px; overflow-y: auto; }
        .list-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; margin-bottom: 6px; position: relative; }
        .list-item:hover { background: var(--glass); }
        .list-item.active { background: rgba(224, 32, 32, 0.15); }
        .list-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }

        .delete-btn { position: absolute; right: 15px; color: #555; font-size: 0.8rem; display: none; }
        .admin-active .list-item:hover .delete-btn { display: block; }

        #managerView, #loginView { position: absolute; inset: 0; background: #111; z-index: 200; display: none; padding: 30px; flex-direction: column; justify-content: center; }
        #managerView { justify-content: flex-start; overflow-y: auto; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.65rem; color: var(--text-dim); margin-bottom: 4px; }
        .form-group input { width: 100%; background: #222; border: 1px solid #333; padding: 10px; border-radius: 8px; color: white; outline: none; }
        .action-btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .admin-btn { background: var(--admin-gold); color: #000; }
        
        .tag-loader-btn { background: #333; color: #fff; font-size: 0.7rem; padding: 5px 10px; border-radius: 4px; cursor: pointer; border: none; margin-bottom: 10px; }
        .tag-loader-btn:hover { background: #444; }

        .persian { direction: rtl; font-family: 'Tahoma', sans-serif; }
        
        #auth-overlay { position: absolute; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .spinner { width:30px; height:30px; border:3px solid #333; border-top-color:var(--accent); border-radius:50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body id="body">

    <div class="app-container">
        <!-- Loader Screen -->
        <div id="auth-overlay">
            <div class="spinner"></div>
            <p id="status-text" style="margin-top:15px; font-size: 0.75rem; color: var(--text-dim)">Syncing Library...</p>
        </div>

        <!-- Login View -->
        <div id="loginView">
            <i class="fas fa-times secondary-btn" style="position:absolute; top:30px; right:30px" onclick="window.closeLogin()"></i>
            <h2 style="margin-bottom: 10px;">Admin Access</h2>
            <div class="form-group">
                <input type="text" id="adminUser" placeholder="Username">
            </div>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="Password">
            </div>
            <button class="action-btn admin-btn" onclick="window.attemptLogin()">Login</button>
        </div>

        <!-- Admin Manager -->
        <div id="managerView">
            <header style="padding: 0 0 20px 0;">
                <h2>Manage Library</h2>
                <div style="display:flex; gap: 15px;">
                    <i class="fas fa-sign-out-alt secondary-btn" onclick="window.logoutAdmin()"></i>
                    <i class="fas fa-times secondary-btn" onclick="window.toggleManager()"></i>
                </div>
            </header>
            
            <div class="form-group">
                <label>MP3 URL (Required)</label>
                <input type="text" id="mUrl" placeholder="https://example.com/song.mp3">
            </div>
            
            <button class="tag-loader-btn" id="btnAutoFill" onclick="window.autoFillFromTags()">
                <i class="fas fa-magic"></i> Auto-fill from MP3 tags
            </button>

            <div class="form-group">
                <label>Track Name</label>
                <input type="text" id="mTitle" placeholder="Track name">
            </div>
            <div class="form-group">
                <label>Artist Name</label>
                <input type="text" id="mArtist" placeholder="Artist name">
            </div>
            <div class="form-group">
                <label>Cover Art URL</label>
                <input type="text" id="mArt" placeholder="Cover Art URL">
            </div>
            
            <button class="action-btn" onclick="window.addSong()">Add to Library</button>
        </div>

        <header>
            <div class="logo-container">
                <img src="https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg" class="brand-logo">
                <span style="font-size: 0.7rem; font-weight: bold;">RADIOZZA</span>
            </div>
            <div>
                <i id="adminIcon" class="fas fa-lock secondary-btn admin-toggle" onclick="window.handleAdminClick()" style="margin-right: 15px"></i>
                <i class="fas fa-cog secondary-btn"></i>
            </div>
        </header>

        <div class="player-display">
            <div class="art-wrapper">
                <img src="https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg" class="art-work" id="mainArt">
            </div>
            <div class="info-stack">
                <h1 id="mainTitle" class="persian">RadioZZA</h1>
                <p id="mainArtist" class="persian">Offline Mode</p>
            </div>
        </div>

        <div class="scrubber">
            <div class="progress-bar" id="progressContainer"><div class="progress-fill" id="progressFill"></div></div>
            <div class="time-stamps"><span id="currTime">0:00</span><span id="durTime">0:00</span></div>
        </div>

        <div class="main-controls">
            <button class="secondary-btn"><i class="fas fa-random"></i></button>
            <button class="secondary-btn" onclick="window.prevSong()"><i class="fas fa-step-backward"></i></button>
            <div class="btn-play" onclick="window.togglePlay()"><i class="fas fa-play" id="playIcon"></i></div>
            <button class="secondary-btn" onclick="window.nextSong()"><i class="fas fa-step-forward"></i></button>
            <button class="secondary-btn"><i class="fas fa-redo"></i></button>
        </div>

        <div class="playlist-drawer" id="playlistItems"></div>
    </div>

    <!-- External library for reading MP3 tags -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_jObj_5sPLaPS55oUcoYQCYRso18cJqo",
            authDomain: "radio-zza.firebaseapp.com",
            projectId: "radio-zza",
            storageBucket: "radio-zza.firebasestorage.app",
            messagingSenderId: "690383318671",
            appId: "1:690383318671:web:67190ec3907a9eaa914afa"
        };

        const els = {
            art: document.getElementById('mainArt'),
            title: document.getElementById('mainTitle'),
            artist: document.getElementById('mainArtist'),
            playIcon: document.getElementById('playIcon'),
            fill: document.getElementById('progressFill'),
            list: document.getElementById('playlistItems'),
            overlay: document.getElementById('auth-overlay'),
            adminIcon: document.getElementById('adminIcon'),
            body: document.getElementById('body'),
            status: document.getElementById('status-text')
        };

        const ADMIN_USER = "radiozza";
        const ADMIN_PASS = "w&Mfg^EFZ5hbYx>";
        const appId = 'radiozza-app-v1';

        let trackList = [];
        let trackIndex = 0;
        let isPlaying = false;
        let user = null;
        let isAdmin = false;
        const audio = new Audio();

        let app, auth, db;

        const init = async () => {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                onAuthStateChanged(auth, (u) => {
                    user = u;
                    els.overlay.style.display = 'none';
                    if (u) startSync();
                });

                await signInAnonymously(auth).catch(err => {
                    if (err.code === 'auth/configuration-not-found') {
                        els.status.innerText = "Guest Mode (Auth Disabled)";
                        setTimeout(() => els.overlay.style.display = 'none', 1000);
                        startSync();
                    }
                });
            } catch (e) {
                els.overlay.style.display = 'none';
            }
        };

        function startSync() {
            if (!db) return;
            const musicCol = collection(db, 'artifacts', appId, 'public', 'data', 'playlist');
            onSnapshot(musicCol, (snap) => {
                trackList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderPlaylist();
                if (trackList.length > 0 && !audio.src) loadTrack(0);
            }, (err) => {
                if (trackList.length === 0) {
                    trackList = [{title: "RadioZZA Stream", artist: "Live", art: els.art.src, url: ""}];
                    renderPlaylist();
                }
            });
        }

        window.autoFillFromTags = () => {
            const url = document.getElementById('mUrl').value;
            if (!url) {
                alert("Please enter an MP3 URL first.");
                return;
            }

            const btn = document.getElementById('btnAutoFill');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Reading Tags...';
            btn.disabled = true;

            // Using jsmediatags to read metadata from a remote URL
            window.jsmediatags.read(url, {
                onSuccess: function(tag) {
                    const tags = tag.tags;
                    if (tags.title) document.getElementById('mTitle').value = tags.title;
                    if (tags.artist) document.getElementById('mArtist').value = tags.artist;
                    
                    // Handle image if present
                    if (tags.picture) {
                        const { data, format } = tags.picture;
                        let base64String = "";
                        for (let i = 0; i < data.length; i++) {
                            base64String += String.fromCharCode(data[i]);
                        }
                        const artBase64 = `data:${format};base64,${window.btoa(base64String)}`;
                        // Note: Storing large base64 in Firestore isn't recommended, 
                        // but we'll put it in the URL field for now.
                        document.getElementById('mArt').value = artBase64;
                    }

                    btn.innerHTML = '<i class="fas fa-check"></i> Success';
                    btn.disabled = false;
                    setTimeout(() => { btn.innerHTML = '<i class="fas fa-magic"></i> Auto-fill from MP3 tags'; }, 2000);
                },
                onError: function(error) {
                    console.error('Error reading tags:', error.type, error.info);
                    alert("Could not read tags. This might be due to CORS restrictions on the MP3 host.");
                    btn.innerHTML = '<i class="fas fa-magic"></i> Auto-fill from MP3 tags';
                    btn.disabled = false;
                }
            });
        };

        window.handleAdminClick = () => {
            if (!user && !isAdmin) {
                document.getElementById('loginView').style.display = 'flex';
            } else if (isAdmin) {
                window.toggleManager();
            } else {
                document.getElementById('loginView').style.display = 'flex';
            }
        };

        window.attemptLogin = () => {
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPassword').value;
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                isAdmin = true;
                els.body.classList.add('admin-active');
                els.adminIcon.className = "fas fa-unlock secondary-btn admin-toggle";
                document.getElementById('loginView').style.display = 'none';
                window.toggleManager();
            } else { alert("Invalid Credentials"); }
        };

        window.logoutAdmin = () => {
            isAdmin = false;
            els.body.classList.remove('admin-active');
            els.adminIcon.className = "fas fa-lock secondary-btn admin-toggle";
            window.toggleManager();
            renderPlaylist();
        };

        window.closeLogin = () => { document.getElementById('loginView').style.display = 'none'; };
        window.toggleManager = () => {
            const v = document.getElementById('managerView');
            v.style.display = (v.style.display === 'flex') ? 'none' : 'flex';
        };

        window.addSong = async () => {
            if (!isAdmin || !db) return;
            const data = {
                title: document.getElementById('mTitle').value || "Unknown Track",
                artist: document.getElementById('mArtist').value || "Unknown Artist",
                art: document.getElementById('mArt').value || els.art.src,
                url: document.getElementById('mUrl').value,
                createdAt: Date.now()
            };
            if(!data.url) return alert("URL is required");
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'playlist'), data);
                ['mTitle', 'mArtist', 'mArt', 'mUrl'].forEach(i => document.getElementById(i).value = '');
            } catch (e) { alert("Error adding song."); }
        };

        window.deleteSong = async (e, id) => {
            e.stopPropagation();
            if (confirm("Delete?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'playlist', id));
        };

        function renderPlaylist() {
            els.list.innerHTML = trackList.map((t, i) => `
                <div class="list-item ${i === trackIndex ? 'active' : ''}" onclick="window.jumpTo(${i})">
                    <img src="${t.art}" onerror="this.src='https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg'">
                    <div style="flex:1">
                        <div class="persian" style="font-size:0.85rem">${t.title}</div>
                        <div class="persian" style="font-size:0.75rem; color:var(--text-dim)">${t.artist}</div>
                    </div>
                    ${isAdmin ? `<i class="fas fa-trash delete-btn" onclick="window.deleteSong(event, '${t.id}')"></i>` : ''}
                </div>
            `).join('');
        }

        function loadTrack(i) {
            trackIndex = i;
            const t = trackList[i];
            els.title.innerText = t.title;
            els.artist.innerText = t.artist;
            els.art.src = t.art;
            audio.src = t.url;
            renderPlaylist();
        }

        window.togglePlay = () => {
            if (isPlaying) { audio.pause(); els.playIcon.className = 'fas fa-play'; els.art.classList.remove('playing'); }
            else { audio.play(); els.playIcon.className = 'fas fa-pause'; els.art.classList.add('playing'); }
            isPlaying = !isPlaying;
        };

        window.nextSong = () => { trackIndex = (trackIndex + 1) % trackList.length; loadTrack(trackIndex); if(isPlaying) audio.play(); };
        window.prevSong = () => { trackIndex = (trackIndex - 1 + trackList.length) % trackList.length; loadTrack(trackIndex); if(isPlaying) audio.play(); };
        window.jumpTo = (i) => { loadTrack(i); if(!isPlaying) window.togglePlay(); else audio.play(); };

        audio.ontimeupdate = () => {
            if (audio.duration) {
                els.fill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
                document.getElementById('currTime').innerText = format(audio.currentTime);
                document.getElementById('durTime').innerText = format(audio.duration);
            }
        };

        function format(s) { const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }

        init();
    </script>
</body>
</html>
