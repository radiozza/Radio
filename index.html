<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioZZA - Live Sync</title>
    <link id="favicon" rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #e02020;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --glass: rgba(255, 255, 255, 0.05);
            --admin-gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        .layout-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .app-container {
            width: 100%;
            max-width: 380px;
            height: 85vh;
            background: var(--bg-color);
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid #222;
            position: relative;
        }

        header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: 32px; object-fit: cover; border-radius: 8px; border: 1px solid #333; }

        .player-display { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 30px; }
        .art-wrapper { position: relative; width: 220px; height: 220px; }
        .art-work { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; transition: all 0.5s; box-shadow: 0 20px 40px rgba(0,0,0,0.6); background: #222; }
        .art-work.playing { transform: scale(1.05); box-shadow: 0 0 30px var(--accent); }

        .info-stack { text-align: center; margin-top: 25px; width: 100%; }
        .info-stack h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
        .info-stack p { color: var(--text-dim); font-size: 0.85rem; }
        
        .live-indicator { 
            font-size: 0.65rem; 
            color: #fff; 
            background: var(--accent); 
            padding: 4px 12px; 
            border-radius: 4px; 
            margin-top: 10px; 
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .scrubber { width: 100%; padding: 20px 35px; }
        .progress-bar { height: 5px; background: #333; border-radius: 10px; cursor: default; position: relative; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; border-radius: 10px; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 0.7rem; margin-top: 8px; color: var(--text-dim); }

        .main-controls { display: flex; justify-content: center; align-items: center; padding: 0 20px 30px; }
        .btn-play { width: 70px; height: 70px; background: var(--text-main); color: #000; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .secondary-btn { color: var(--text-dim); font-size: 1.2rem; cursor: pointer; background: none; border: none; transition: color 0.2s; }
        .secondary-btn:hover { color: var(--text-main); }

        .playlist-drawer { background: var(--card-bg); border-top: 1px solid #2a2a2a; padding: 15px; max-height: 250px; overflow-y: auto; flex-shrink: 0; }
        .list-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; margin-bottom: 6px; position: relative; opacity: 0.6; }
        .list-item.active { background: rgba(224, 32, 32, 0.15); opacity: 1; border: 1px solid rgba(224, 32, 32, 0.3); }
        .list-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }

        #managerPanel { 
            width: 350px; background: var(--card-bg); border-radius: 30px; border: 1px solid #333;
            padding: 25px; display: none; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-height: 85vh; overflow-y: auto;
        }

        #loginView { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; 
            display: none; flex-direction: column; justify-content: center; align-items: center; padding: 40px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; }
        .form-group input { width: 100%; background: #000; border: 1px solid #333; padding: 12px; border-radius: 10px; color: white; outline: none; }
        
        .action-btn { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; }
        .admin-btn { background: var(--admin-gold); color: #000; }

        #auth-overlay { position: absolute; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .spinner { width:30px; height:30px; border:3px solid #333; border-top-color:var(--accent); border-radius:50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .persian { direction: rtl; font-family: 'Tahoma', sans-serif; }
        
        .delete-btn { position: absolute; right: 15px; color: #555; cursor: pointer; padding: 5px; }
        .delete-btn:hover { color: var(--accent); }

        @media (max-width: 800px) {
            .layout-wrapper { flex-direction: column; align-items: center; }
            #managerPanel { width: 100%; max-width: 380px; }
        }
    </style>
</head>
<body>

    <div class="layout-wrapper">
        <div class="app-container">
            <div id="auth-overlay">
                <div class="spinner"></div>
                <p style="margin-top:15px; font-size: 0.75rem; color: var(--text-dim)">Syncing with Global Stream...</p>
            </div>

            <div id="loginView">
                <i class="fas fa-times secondary-btn" style="position:absolute; top:30px; right:30px" onclick="window.closeLogin()"></i>
                <h2 style="margin-bottom: 20px;">Admin</h2>
                <input type="password" id="adminPassword" placeholder="Code" style="width:100%; background:#222; color:#fff; border:none; padding:15px; border-radius:10px; margin-bottom:20px; text-align:center;">
                <button class="action-btn admin-btn" onclick="window.attemptLogin()">Unlock CMS</button>
            </div>

            <header>
                <div class="logo-container">
                    <img src="https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg" class="brand-logo">
                    <div>
                        <span style="font-size: 0.7rem; font-weight: bold;">RADIOZZA</span>
                        <div style="font-size: 0.6rem; color: #4ade80;"><span id="listenerCount">1</span> Listeners</div>
                    </div>
                </div>
                <i id="adminIcon" class="fas fa-lock secondary-btn" onclick="window.handleAdminClick()"></i>
            </header>

            <div class="player-display">
                <div class="art-wrapper">
                    <img src="https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg" class="art-work" id="mainArt">
                </div>
                <div class="info-stack">
                    <h1 id="mainTitle" class="persian">RadioZZA</h1>
                    <p id="mainArtist" class="persian">Live Stream</p>
                    <div class="live-indicator"><i class="fas fa-broadcast-tower"></i> Live</div>
                </div>
            </div>

            <div class="scrubber">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-stamps"><span id="currTime">0:00</span><span id="durTime">0:00</span></div>
            </div>

            <div class="main-controls">
                <div class="btn-play" onclick="window.togglePlay()"><i class="fas fa-play" id="playIcon"></i></div>
            </div>

            <div class="playlist-drawer" id="playlistItems"></div>
        </div>

        <div id="managerPanel">
            <h3 style="color: var(--admin-gold); margin-bottom: 20px;">CMS MANAGER</h3>
            <div class="form-group"><label>Direct MP3 URL</label><input type="text" id="mUrl"></div>
            <div class="form-group"><label>Duration (Seconds)</label><input type="number" id="mDur" placeholder="e.g. 180"></div>
            <div class="form-group"><label>Title</label><input type="text" id="mTitle"></div>
            <div class="form-group"><label>Artist</label><input type="text" id="mArtist"></div>
            <div class="form-group"><label>Art URL</label><input type="text" id="mArt"></div>
            <button class="action-btn" onclick="window.addSong()">Add to Live Rotation</button>
            <button class="action-btn admin-btn" style="margin-top:10px;" onclick="window.resetStream()">Reset Global Timer</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_jObj_5sPLaPS55oUcoYQCYRso18cJqo",
            authDomain: "radio-zza.firebaseapp.com",
            projectId: "radio-zza",
            storageBucket: "radio-zza.firebasestorage.app",
            messagingSenderId: "690383318671",
            appId: "1:690383318671:web:67190ec3907a9eaa914afa"
        };

        const els = {
            art: document.getElementById('mainArt'),
            title: document.getElementById('mainTitle'),
            artist: document.getElementById('mainArtist'),
            playIcon: document.getElementById('playIcon'),
            fill: document.getElementById('progressFill'),
            list: document.getElementById('playlistItems'),
            overlay: document.getElementById('auth-overlay'),
            manager: document.getElementById('managerPanel'),
            login: document.getElementById('loginView'),
            listeners: document.getElementById('listenerCount')
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'radiozza-live-v2';
        const audio = new Audio();
        audio.crossOrigin = "anonymous";

        let app, auth, db;
        let trackList = [];
        let globalStartTime = 0;
        let isPlaying = false;
        let isAdmin = false;
        let user = null;

        const init = async () => {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            onAuthStateChanged(auth, async (u) => {
                user = u;
                if (u) {
                    els.overlay.style.display = 'none';
                    syncStream();
                    trackPresence(u.uid);
                }
            });
            await signInAnonymously(auth);
        };

        async function syncStream() {
            // 1. Get Global Stream Metadata (Start Time)
            const streamRef = doc(db, 'artifacts', appId, 'public', 'data', 'stream_state', 'current');
            onSnapshot(streamRef, (snap) => {
                if (snap.exists()) {
                    globalStartTime = snap.data().startTime;
                } else {
                    // Initialize if missing
                    globalStartTime = Date.now();
                    setDoc(streamRef, { startTime: globalStartTime });
                }
                calculateLivePosition();
            });

            // 2. Sync Playlist
            const playlistCol = collection(db, 'artifacts', appId, 'public', 'data', 'playlist');
            onSnapshot(playlistCol, (snap) => {
                trackList = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.createdAt - b.createdAt);
                renderPlaylist();
                calculateLivePosition();
            });
        }

        function calculateLivePosition() {
            if (trackList.length === 0 || !globalStartTime) return;

            const totalDuration = trackList.reduce((acc, t) => acc + (parseInt(t.duration) || 180), 0);
            const elapsedMs = Date.now() - globalStartTime;
            const elapsedSec = elapsedMs / 1000;
            const currentCyclePos = elapsedSec % totalDuration;

            let cumulative = 0;
            let currentTrackIndex = 0;
            let seekTo = 0;

            for (let i = 0; i < trackList.length; i++) {
                const dur = parseInt(trackList[i].duration) || 180;
                if (currentCyclePos < (cumulative + dur)) {
                    currentTrackIndex = i;
                    seekTo = currentCyclePos - cumulative;
                    break;
                }
                cumulative += dur;
            }

            const track = trackList[currentTrackIndex];
            if (audio.src !== track.url) {
                audio.src = track.url;
                audio.currentTime = seekTo;
                updateUI(track);
                if (isPlaying) audio.play();
            } else {
                // If drift is more than 2 seconds, re-sync
                if (Math.abs(audio.currentTime - seekTo) > 2) {
                    audio.currentTime = seekTo;
                }
            }
        }

        function updateUI(track) {
            els.title.innerText = track.title;
            els.artist.innerText = track.artist;
            els.art.src = track.art;
            document.getElementById('durTime').innerText = format(track.duration);
            renderPlaylist();
        }

        function renderPlaylist() {
            els.list.innerHTML = trackList.map((t) => `
                <div class="list-item ${audio.src === t.url ? 'active' : ''}">
                    <img src="${t.art}">
                    <div style="flex:1">
                        <div class="persian" style="font-size:0.8rem">${t.title}</div>
                        <div style="font-size:0.7rem; color:var(--text-dim)">${t.artist}</div>
                    </div>
                    ${isAdmin ? `<i class="fas fa-trash delete-btn" onclick="window.removeSong('${t.id}')"></i>` : ''}
                </div>
            `).join('');
        }

        window.togglePlay = () => {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                els.playIcon.className = "fas fa-play";
            } else {
                calculateLivePosition(); // Recalculate exactly where we should be
                audio.play();
                isPlaying = true;
                els.playIcon.className = "fas fa-pause";
            }
        };

        // Standard helpers
        window.handleAdminClick = () => isAdmin ? els.manager.style.display = 'flex' : els.login.style.display = 'flex';
        window.closeLogin = () => els.login.style.display = 'none';
        window.attemptLogin = () => {
            if (document.getElementById('adminPassword').value === "admin123") {
                isAdmin = true;
                els.login.style.display = 'none';
                els.manager.style.display = 'flex';
                els.adminIcon.className = "fas fa-unlock secondary-btn";
                renderPlaylist();
            }
        };

        window.addSong = async () => {
            const data = {
                url: document.getElementById('mUrl').value,
                duration: parseInt(document.getElementById('mDur').value) || 180,
                title: document.getElementById('mTitle').value,
                artist: document.getElementById('mArtist').value,
                art: document.getElementById('mArt').value || 'https://raw.githubusercontent.com/radiozza/Radio/refs/heads/main/1404-10-14%2021.53.40.jpg',
                createdAt: Date.now()
            };
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'playlist'), data);
            ['mUrl','mDur','mTitle','mArtist','mArt'].forEach(id => document.getElementById(id).value = '');
        };

        window.removeSong = async (id) => {
            if(confirm("Remove?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'playlist', id));
        };

        window.resetStream = async () => {
            if(confirm("Reset global timer for all listeners?")) {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stream_state', 'current'), { startTime: Date.now() });
            }
        };

        function trackPresence(uid) {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'presence', uid);
            const up = () => setDoc(ref, { last: Date.now() });
            up(); setInterval(up, 30000);
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'presence'), (s) => {
                const active = s.docs.filter(d => (Date.now() - d.data().last) < 60000).length;
                els.listeners.innerText = active || 1;
            });
        }

        audio.ontimeupdate = () => {
            els.fill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
            document.getElementById('currTime').innerText = format(audio.currentTime);
        };

        audio.onended = () => calculateLivePosition(); // Auto-switch to next song in live cycle

        function format(s) {
            const m = Math.floor(s/60);
            const sec = Math.floor(s%60);
            return `${m}:${sec<10?'0':''}${sec}`;
        }

        init();
    </script>
</body>
</html>
